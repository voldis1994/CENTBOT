# CENTBOT — live platform configuration (no demo catalogs)
system:
  name: CENTBOT
  mode: live  # live = real claims/submits; use --controlled-live / --demo for dry practice
  timezone: Europe/London
  cycle_interval_seconds: 60
  # Must be >= android.max_emulators so 4 Android workers are not starved by the pool
  max_parallel_tasks: 6
  emergency_stop_file: data/EMERGENCY_STOP
  pid_file: data/centbot.pid

database:
  path: data/centbot.db

logging:
  directory: logs
  level: INFO
  max_bytes: 10485760
  backup_count: 10

monitoring:
  cpu_warn_percent: 85
  ram_warn_percent: 85
  gpu_warn_percent: 90
  internet_check_url: https://1.1.1.1
  internet_check_interval_seconds: 60
  sample_interval_seconds: 15

recovery:
  enabled: true
  max_restarts: 5
  restart_backoff_seconds: 10

backup:
  enabled: true
  directory: backups
  interval_hours: 6
  keep_count: 14

security:
  credentials_file: data/credentials.enc
  rate_limit_per_minute: 20
  sandbox_dir: sandbox

ai:
  ollama_base_url: http://127.0.0.1:11434
  model: tinyllama
  # Heuristic analysis always runs; Ollama enriches when installed. Keep true so LIVE plans create deliverables.
  enabled: true
  timeout_seconds: 60

platforms:
  jobbi:
    enabled: true
    base_url: https://jobbi.org
    lane: agent
    min_reward: 1
    limit: 100
    # optional: currency: USD / source: algora / query: python / operator: centbot
  basedagents:
    enabled: true
    base_url: https://api.basedagents.ai
    min_usdc: 0.1
    limit: 50
    keypair_path: data/basedagents-keypair.json
    auto_register: true
  taskmarket:
    enabled: true
    base_url: https://api.taskmarket.dev
    min_reward: 0.5
    limit: 50
    # mode: omit = all open (bounty+claim). Stake/hire soft-skipped, not rejected.
    allow_stake_claims: false  # stakeRequired needs ~1 USDC x402 on Base
    wallet_env: CENTBOT_ETH_PRIVATE_KEY
  bountybook:
    enabled: true
    base_url: https://api.bountybook.ai
    min_reward: 1
    limit: 50
    api_key_env: BOUNTYBOOK_API_KEY
    wallet_env: CENTBOT_ETH_PRIVATE_KEY
  agentizable:
    enabled: true
    base_url: https://api.agentizable.ai
    network: base-mainnet
    claimable_only: true
    min_reward: 1
  # extra:
  #   - name: customboard
  #     enabled: true
  #     base_url: https://api.example.com
  #     list_path: /v1/tasks
  #     api_key_env: CUSTOM_API_KEY

discovery:
  poll_interval_seconds: 300  # Jobbi asks for ~hourly; keep >= 60
  min_reward: 0.5
  currencies: [USD, USDC, EUR, GBP, USDT, BTC, ETH]
  duplicate_similarity_threshold: 0.92
  auto_register_allowed: true
  auto_discover_platforms: true  # probe known public boards and attach reachable extras

analysis:
  min_expected_profit: 0.25
  min_reward_probability: 0.35
  max_estimated_hours: 8
  reject_unfunded: true
  reject_untrusted_payer_below: 0.25
  auto_accept: true  # required for live claims/submits

finance:
  crypto_wallet_public: ""  # public receive / payout address
  bank_iban: ""  # expected fiat recipient IBAN (required for bank booking)
  bank_provider_base_url: ""  # independent bank/payment API, e.g. https://api.wise.com/v1
  bank_provider_api_key_env: CENTBOT_BANK_PROVIDER_API_KEY
  supported_currencies: [USD, EUR, GBP, USDC, USDT, BTC, ETH]
  default_currency: USD
  withdrawal_requires_manual_approval: true
  stop_platform_after_losses: 3
  stop_platform_loss_window_hours: 72
  simulate_rewards_in_dry_run: false
  reconcile_payments: true
  require_tx_hash: true  # book income only with real settlement tx evidence
  verify_on_chain: true  # chain check: recipient, token, amount, confirmations
  min_confirmations: 1

android:
  enabled: true
  adb_path: adb
  emulator_path: emulator
  max_emulators: 4
  default_avd: CENTBOT_ANDROID_01
  avds:
    - CENTBOT_ANDROID_01
    - CENTBOT_ANDROID_02
    - CENTBOT_ANDROID_03
    - CENTBOT_ANDROID_04

operator:
  full_name: ""
  country: ""
  email: ""
  phone: ""

notifications:
  email: true
  desktop: true

browser:
  enabled: true
  headless: true
  timeout_ms: 30000
  user_agent: "CENTBOT/1.0 (+https://github.com/voldis1994/CENTBOT)"

dashboard:
  host: 127.0.0.1
  port: 8787
  enabled: true

profit_optimization:
  enabled: true
  learn_from_rewards: true
  rebalance_every_cycles: 20
